[package]
name = "fan_control"
version = "0.1.0"
edition = "2021"

[dependencies]
embassy-executor     = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time         = { version = "0.5", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-rp           = { version = "0.10", features = ["defmt", "rp235xa", "time-driver", "critical-section-impl", "binary-info"] }
embassy-sync         = "0.8"
embassy-embedded-hal = "0.6"
one-wire-bus = "0.1"

cortex-m = "0.7"
cortex-m-rt = "0.7"
defmt = "1.1.1"
defmt-rtt = "1.3.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }


cyw43 = { version = "0.7.0", features = ["defmt", "firmware-logs"] }
cyw43-pio = { version = "0.10.0"}
embassy-net = { version = "0.9.0", features = ["defmt", "tcp", "dhcpv4", "medium-ethernet"] }
picoserve = { version = "0.20.0", features = ["embassy", "json"] }
embedded-io-async = "0.7.0"
serde = { version = "1.0", default-features = false, features = ["derive"] }
static_cell = "2.1"
heapless = "0.9.3"

[profile.release]
debug = 2
lto = true
opt-level = "s"
incremental = false
codegen-units = 1

[profile.dev]
debug = 2
opt-level = "s"
overflow-checks = false

[features]
cyw43 = []
fw = []

