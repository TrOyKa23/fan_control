[package]
name = "fan_control"
version = "0.1.0"
edition = "2021"

[dependencies]
embassy-executor     = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time         = { version = "0.5", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-rp           = { version = "0.10", features = ["defmt", "rp235xa", "time-driver", "critical-section-impl", "binary-info"] }
embassy-sync         = "0.8"
embassy-embedded-hal = "0.6"

cortex-m = "0.7"
cortex-m-rt = "0.7"
defmt = "1.1.1"
defmt-rtt = "1.3.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

[profile.release]
debug = 2
lto = true
opt-level = "s"
incremental = false
codegen-units = 1

[profile.dev]
debug = 2
opt-level = "s"
